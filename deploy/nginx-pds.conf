# nginx front end for the Production Deployment Scheduler.
#
#   sudo cp deploy/nginx-pds.conf /etc/nginx/sites-available/pds
#   sudo ln -s /etc/nginx/sites-available/pds /etc/nginx/sites-enabled/pds
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d deployments.example.com     # adds TLS + redirect
#
# nginx only terminates TLS and forwards everything. It does NOT need to route
# /api separately or serve any static files — the application owns both.

server {
    listen 80;
    listen [::]:80;
    server_name deployments.example.com;

    # Deployment documents can be large; keep this at or above the app's
    # MAX_FILE_SIZE_MB so nginx does not reject an upload before the API can
    # return its own readable error.
    client_max_body_size 32m;

    access_log /var/log/nginx/pds.access.log;
    error_log  /var/log/nginx/pds.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long enough for a 20 MB upload on a slow link.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_request_buffering off;
    }
}
