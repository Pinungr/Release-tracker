services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: pds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduler} -d ${POSTGRES_DB:-scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${AI_KEEP_ALIVE:-30m}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: on-failure
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'ollama pull "$$AI_MODEL" && ollama pull "$$AI_EMBEDDING_MODEL"'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pds-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-scheduler}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-scheduler}}
      STORAGE_DIR: /var/lib/pds/storage
      FRONTEND_DIST: /app/frontend/dist
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-string}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin2024}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_API_KEY: ${MCP_API_KEY:-}

      # Default: local Qwen3 chat with PostgreSQL tools and in-memory FAISS RAG.
      AI_PROVIDER: ${AI_PROVIDER:-ollama_rag}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-512}
      AI_CONTEXT_WINDOW: ${AI_CONTEXT_WINDOW:-8192}
      AI_NUM_THREADS: ${AI_NUM_THREADS:-0}
      AI_PLAN_CACHE_SECONDS: ${AI_PLAN_CACHE_SECONDS:-300}
      AI_KEEP_ALIVE: ${AI_KEEP_ALIVE:-30m}
      AI_MODEL: ${AI_MODEL:-qwen3:8b}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-nomic-embed-text}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}

      # Future organisation/hosted Responses-compatible AI gateway.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_PATH: ${AI_API_PATH:-}
      AI_AUTH_HEADER: ${AI_AUTH_HEADER:-}
      AI_AUTH_SCHEME: ${AI_AUTH_SCHEME:-}
      AI_ANTHROPIC_VERSION: ${AI_ANTHROPIC_VERSION:-2023-06-01}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app-storage:/var/lib/pds/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  app-storage:
  ollama-data:
